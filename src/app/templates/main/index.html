{% extends "base.html" %}

{% block content %}
<h1>Welcome to CXR-RAG</h1>

{% if current_user.is_authenticated %}
    <p>You are logged in as <strong>{{ current_user.username }}</strong>.</p>
    <p><a href="{{ url_for('main.analyze') }}">Analyze a chest X-ray</a></p>
    <p><a href="{{ url_for('main.history') }}">My history</a></p>
{% else %}
    <p>Please <a href="{{ url_for('auth.login') }}">log in</a>
       or <a href="{{ url_for('auth.register') }}">register</a> to continue.</p>
{% endif %}
{% endblock %}
