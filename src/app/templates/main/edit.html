{% extends "base.html" %}

{% block content %}
<h1>Edit result</h1>

<form method="post" novalidate>
    {{ form.hidden_tag() }}

    <p>
        {{ form.content.label }}<br>
        {{ form.content(rows=4, cols=60) }}<br>
        {% for error in form.content.errors %}
            <span style="color: red;">[{{ error }}]</span>
        {% endfor %}
    </p>

    <p>{{ form.submit() }}</p>
</form>


<p><a href="{{ url_for('main.history') }}">View my analysis history</a></p>
{% endblock %}
